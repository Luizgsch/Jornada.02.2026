# Actuator possui configuracao CORS propria, separada dos controllers MVC.
management.endpoints.web.cors.allowed-origins=${cash.web.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
cash.web.allowed-origins=${CASH_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://localhost,http://10.0.2.2:3000}
