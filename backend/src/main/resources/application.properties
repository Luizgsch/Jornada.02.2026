spring.application.name=CashMobile
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Documentação habilitada explicitamente no ambiente local.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/v1/**
cash.auth.session-ttl=${CASH_SESSION_TTL:PT30M}
cash.auth.max-sessions=${CASH_MAX_SESSIONS:1000}
cash.movements.max-records=${CASH_MOVEMENTS_MAX_RECORDS:10000}
cash.documents.max-total-bytes=${CASH_DOCUMENTS_MAX_TOTAL_BYTES:52428800}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=5MB
spring.servlet.multipart.location=${CASH_UPLOAD_TEMP:${java.io.tmpdir}}
